# Simulación de deploy productivo "mismo origen": nginx sirve el build de la
# SPA y forwardea los prefijos de la API al backend.
#
# Regla de enrutado (igual que el bypass de vite.config.ts):
#   - Navegación del navegador (Accept: text/html) -> index.html (SPA)
#   - Fetch/XHR/webhooks (Accept: */*, application/json, etc.) -> API
#
# Uso local:
#   docker run -d --name odonto-nginx -p 8080:80 \
#     -v "$PWD/frontend/dist:/usr/share/nginx/html:ro" \
#     -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
#     nginx:alpine
# (requiere la API accesible desde el contenedor, ej. uvicorn en 0.0.0.0:8000)

upstream odontologia_api {
    server host.docker.internal:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Truco nginx: `return 418` dentro de un `if` no puede convivir con
    # try_files/proxy_pass en la misma location; se usa error_page para
    # redirigir internamente al named location @spa.
    error_page 418 = @spa;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Archivos estáticos del build (tienen hash, cache agresivo)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Todo lo demás: archivo estático si existe; si no, decidir SPA vs API
    # según el header Accept (navegación vs fetch).
    location / {
        try_files $uri $uri/ @app;
    }

    location @app {
        # Navegación del navegador -> servir la SPA
        if ($http_accept ~* "text/html") {
            return 418;
        }
        proxy_pass http://odontologia_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location @spa {
        rewrite ^ /index.html break;
    }
}
