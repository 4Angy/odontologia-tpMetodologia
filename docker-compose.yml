# Deploy único del proyecto (DD-03): api + worker + postgres 16 + redis 7.
#
# Sin secretos: todo sale de variables del `.env` (ver `.env.example`).
# `JWT_SECRET` y `POSTGRES_PASSWORD` son obligatorias: si faltan, el compose
# falla al arrancar en vez de usar un valor por defecto.

name: odontologia

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?falta POSTGRES_USER en el .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en el .env}"
      POSTGRES_DB: ${POSTGRES_DB:-odontologia}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odontologia} -d ${POSTGRES_DB:-odontologia}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

  redis:
    image: redis:7
    # AOF: la cola de C-09 no puede perder recordatorios en un reinicio.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-odontologia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-odontologia}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: "${JWT_SECRET:?falta JWT_SECRET en el .env - generalo con openssl rand -hex 32}"
      JWT_ACCESS_MIN: ${JWT_ACCESS_MIN:-15}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
      TENANT_DEFAULT_TZ: ${TENANT_DEFAULT_TZ:-America/Argentina/Buenos_Aires}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-official}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      SMTP_URL: ${SMTP_URL:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
      SEED_DEMO: ${SEED_DEMO:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://localhost:8000/health/ready', timeout=3).status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    ports:
      - "${API_HOST_PORT:-8000}:8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker.main"]
    environment:
      # Sólo el servicio `api` aplica migraciones: si los dos lo hacen, corren
      # en paralelo y se pisan al crear `alembic_version`.
      RUN_MIGRATIONS: "false"
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-odontologia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-odontologia}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: "${JWT_SECRET:?falta JWT_SECRET en el .env - generalo con openssl rand -hex 32}"
      JWT_ACCESS_MIN: ${JWT_ACCESS_MIN:-15}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
      TENANT_DEFAULT_TZ: ${TENANT_DEFAULT_TZ:-America/Argentina/Buenos_Aires}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-official}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      SMTP_URL: ${SMTP_URL:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
      SEED_DEMO: ${SEED_DEMO:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
