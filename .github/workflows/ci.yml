name: CI

# C-01: jobs backend y frontend en paralelo, sin dependencias entre sí.
# El job backend corre la suite contra Postgres 16 real (no SQLite) y verifica
# que las migraciones son reversibles (R6).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odontologia
          POSTGRES_PASSWORD: odontologia
          POSTGRES_DB: odontologia_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U odontologia -d odontologia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      APP_ENV: test
      LOG_LEVEL: WARNING
      # Secreto de CI: no es un secreto real, sólo cumple la regla de arranque.
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-ci-secret-01
      DATABASE_URL: postgresql+psycopg://odontologia:odontologia@localhost:5432/odontologia_test
      REDIS_URL: redis://localhost:6379/0
      TEST_DATABASE_URL: postgresql+psycopg://odontologia:odontologia@localhost:5432/odontologia_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt

      - name: Preparar base de tests limpia
        working-directory: backend
        run: |
          python -c "import os; from sqlalchemy import create_engine, text; engine=create_engine(os.environ['DATABASE_URL']).execution_options(isolation_level='AUTOCOMMIT'); connection=engine.connect(); connection.execute(text('DROP SCHEMA public CASCADE')); connection.execute(text('CREATE SCHEMA public')); connection.close(); engine.dispose()"

      - name: Migraciones reversibles (R6)
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade -1
          python -m alembic upgrade head

      - name: Tests
        working-directory: backend
        run: python -m pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Typecheck (R10)
        working-directory: frontend
        run: npm run typecheck

      - name: Tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
